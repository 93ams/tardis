[package]
name = "tardis_rust_probe"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["staticlib"]

[dependencies]
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread", "net", "time", "sync", "io-util"], optional = true }

hyper = { version = "1", default-features = false, features = ["http1", "server", "client"], optional = true }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"], optional = true }
http-body-util = { version = "0.1", optional = true }

[features]
default = ["tokio", "http"]
http = ["tokio", "dep:hyper", "dep:hyper-util", "dep:http-body-util"]

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
