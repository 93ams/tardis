[package]
name = "tardis_rust_probe"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["staticlib"]

[dependencies]
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread", "net", "time", "sync", "io-util"], optional = true }

[features]
default = ["tokio"]

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
