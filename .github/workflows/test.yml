# The whole suite on Linux, macOS and Windows (plan.md §10): the same
# seeds must give the same traces on each, and the golden trace hash
# recorded on Windows is checked on all three.
name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: tardis
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - name: Formatting
        working-directory: tardis
        run: zig fmt --check src build.zig
      - name: Tests
        working-directory: tardis
        shell: bash
        env:
          # If a real filesystem call panics inside std, this file holds
          # the sequence that did it (diff_fs_test.zig).
          TARDIS_DIFF_TRACE: diff_fs.trace
          # On Linux x86_64 a check whose code makes a real system call
          # fails (plan3.md D3); ignored on the other systems.
          TARDIS_TRAP_SYSCALLS: 1
        run: |
          set -o pipefail
          zig build test --summary all 2>&1 | tee test.log
      - name: Tests with the security layer on every check
        working-directory: tardis
        shell: bash
        run: |
          set -o pipefail
          zig build test -Dsec --summary all 2>&1 | tee test.log
      - name: Tests, optimized
        working-directory: tardis
        shell: bash
        run: |
          set -o pipefail
          zig build test -Doptimize=ReleaseSafe --summary all 2>&1 | tee test.log
      # The log needs an account to read; annotations do not.
      - name: Name the failures
        if: failure()
        working-directory: tardis
        shell: bash
        run: |
          if [ -f diff_fs.trace ]; then tail -6 diff_fs.trace | while IFS= read -r line; do echo "::error::diff_fs trace: $line"; done; fi
          grep -aE "^error: '|tardis: (FAILED|always|error\.)|diff_(fs|net): |panic|Segmentation|expected .*, found|error: .*\.zig:" test.log | head -10 | while IFS= read -r line; do
            echo "::error::${line:0:300}"
          done
      # The whole log of the test step that failed, with its replay lines
      # (docs/reproducing.md), and the last sequence diff_fs ran (the
      # failing one only when that test is what failed).
      - name: Keep the log of a failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-failure-${{ matrix.os }}
          path: |
            tardis/test.log
            tardis/diff_fs.trace
          if-no-files-found: ignore
          retention-days: 14
      # Numbers that follow from the seed must not move; timings must stay
      # within a generous budget (scripts/bench_budgets.txt).
      # Every planted bug found, every fix passing (plan3.md F1).
      - name: Bug benchmark
        working-directory: tardis
        run: zig build bugbench
      # Every public declaration of the API has a doc comment, and the
      # reference builds from them (plan3.md C4).
      - name: API reference
        if: matrix.os == 'ubuntu-latest'
        working-directory: tardis
        run: |
          python3 scripts/doc_check.py
          zig build docs
      - name: Benchmarks against their budgets
        if: matrix.os == 'ubuntu-latest'
        working-directory: tardis
        run: zig build bench 2>&1 | python3 scripts/bench_check.py
