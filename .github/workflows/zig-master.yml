# The suite against Zig's development branch, weekly (plan3.md B6).
# TARDIS implements `std.Io`, which is still changing: this run going red
# is the early warning that the next Zig release will need work here. It
# does not gate anything.
name: zig-master

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: tardis
      - uses: mlugg/setup-zig@v2
        with:
          version: master
      - name: Zig version
        run: zig version
      - name: Tests
        working-directory: tardis
        run: zig build test --summary all
